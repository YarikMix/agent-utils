name: TypeScript native LSP
on:
  push:
    paths:
      - 'plugins/typescript-native-lsp/codex/**'
      - '.github/workflows/typescript-native-lsp.yml'
  pull_request:
    paths:
      - 'plugins/typescript-native-lsp/codex/**'
      - '.github/workflows/typescript-native-lsp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins/typescript-native-lsp/codex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/typescript-native-lsp/codex/package-lock.json
          registry-url: https://registry.npmjs.org
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run typecheck --registry=https://registry.npmjs.org
      - run: npm run verify-build --registry=https://registry.npmjs.org
      - run: npm test --registry=https://registry.npmjs.org
      - run: npm run test:live --registry=https://registry.npmjs.org
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-${{ matrix.os }}-node-${{ matrix.node }}
          path: plugins/typescript-native-lsp/codex/.native-test-artifacts/
          if-no-files-found: ignore
